# Shared cold-launch preamble: stop, relaunch, let the remembered Metro bundle mount (avoids the
# dev-client "app context has been lost" reload race), attach Metro, clear dev-menu / onboarding /
# login / ATT / free-trial gates, and wait for Home. Include with `runFlow: common/launch.yaml`.
appId: dev.lumilabs.oneplan
---
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "fab"
    timeout: 20000
    optional: true
- openLink: "dev.lumilabs.oneplan://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "^Continue$"
- runFlow:
    when:
      visible: "^Go home$"
    commands:
      - tapOn:
          point: "90%,48%"
- runFlow:
    when:
      visible: "Welcome to One Plan"
    commands:
      - repeat:
          while:
            visible: "^Continue$"
          commands:
            - tapOn: "^Continue$"
            - waitForAnimationToEnd:
                timeout: 1500
      - tapOn: "^Get Started$"
- runFlow:
    when:
      visible: "Continue with Google"
    commands:
      - tapOn:
          id: "login-dev"
- runFlow:
    when:
      visible: "Ask App Not to Track"
    commands:
      - tapOn: "Ask App Not to Track"
- runFlow:
    when:
      visible:
        id: "free-trial-screen"
    commands:
      - tapOn:
          id: "trial-close"
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible:
      id: "fab"
    timeout: 60000
