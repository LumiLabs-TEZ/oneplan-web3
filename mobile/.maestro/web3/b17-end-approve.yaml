# B (spike): Review opens on its own again → Approve → the vote is unanimous: the trip ends, the
# vault settles on chain, and both devices land on the trip-end screen.
appId: local.lumilabs.oneplan
---
- extendedWaitUntil:
    visible:
      id: "trip-end-review-approve"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "trip-end-review-approve"
- extendedWaitUntil:
    visible:
      id: "trip-end-tabs"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
